version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: smartdoc_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smartdoc
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build: .
    container_name: smartdoc_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:root123@db:3306/smartdoc
      SECRET_KEY: your-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data: